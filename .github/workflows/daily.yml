name: Daily claim
on:
  schedule:
    - cron: '0 9 * * *' 

jobs:
  Daily:
    runs-on: ubuntu-latest
    steps:
      - name: Check for IsJWT Secret
        id: IsJWT
        shell: bash
        run: |
          if [ "${{ secrets.IsJWT }}" != '' ]; then
            echo "available=true" >> $GITHUB_OUTPUT;
          else
            echo "available=false" >> $GITHUB_OUTPUT;
          fi

      - name: Set IsJWT Value
        if: ${{ steps.IsJWT.outputs.available == 'true' }}
        id: IsJWTValue
        shell: bash
        run: |
          if [ "${{ secrets.IsJWT }}" == 'false' ]; then
            echo "value=0" >> $GITHUB_OUTPUT;
          else
            echo "value=1" >> $GITHUB_OUTPUT;
          fi

      - uses: actions/checkout@v4
      - name: Run HoneygainPot (NEW)
        if: ${{ steps.IsJWT.outputs.available == 'true' }}
        run: python main.py
        env:
          MAIL: ${{ secrets.MAIL }}
          PASS: ${{ secrets.PASS }}
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
          IsJWT: ${{ steps.IsJWTValue.outputs.value }}
      - uses: actions/checkout@v4
      - name: Run HoneygainPot (OLD)
        if: ${{ steps.IsJWT.outputs.available != 'true' }}
        run: python main.py
        env:
          MAIL: ${{ secrets.MAIL }}
          PASS: ${{ secrets.PASS }}
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
          IsJWT: 1
